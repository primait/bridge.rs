name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup default 1.94.1
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # ratchet:Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-make,cargo-deny@0.19
      - run: cargo make fmt-check
      - run: cargo make clippy
      - run: cargo make deny-check
      - run: cargo make docs
  test:
    services:
      aws:
        image: motoserver/moto:5.1.21
        env:
          # Set up moto in a way that matches localstack
          MOTO_PORT: 4566
          MOTO_ACCOUNT_ID: "000000000000"
        ports:
          - "4566:4566"
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: eu-west-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup default 1.94.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # ratchet:Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # 2.90.0
        with:
          tool: cargo-make
      - run: cargo make test

  alls-green:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - run: ${{ !contains(needs.*.result, 'failure') }}
