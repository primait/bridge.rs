name: Build Release Candidate

on:
  workflow_dispatch: {}

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-rc:
    name: Build Release Candidate
    runs-on: k8s-small
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    concurrency:
      group: bridge-rs-release-candidate
      cancel-in-progress: false
    steps:
      - name: Install GitHub CLI
        uses: primait/shared-github-actions/actions/install-gh-cli@install-gh-cli-v1

      - name: Check out selected branch and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: primait/shared-github-actions/actions/install-rust@install-rust-v1
        with:
          rust-toolchain: "1.94.1"

      - name: Read draft release version
        id: base-version
        run: |
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == true)' -X GET --paginate > "$RUNNER_TEMP/draft.json"
          DRAFT=$(jq -sc 'if length == 1 then .[0] else error("Expected exactly one draft release") end' "$RUNNER_TEMP/draft.json")
          VERSION=$(jq -r '.tag_name' <<< "$DRAFT")

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid base version: $VERSION (expected X.Y.Z)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release candidate
        id: candidate
        env:
          VERSION: ${{ steps.base-version.outputs.VERSION }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          PACKAGE_VERSION="${VERSION}-rc.${RUN_NUMBER}"
          ARTIFACT_NAME="prima_bridge-${PACKAGE_VERSION}"

          sed -i -E "s/^(version = \").*\"/\1${PACKAGE_VERSION}\"/" Cargo.toml
          cargo update --workspace
          grep -Fx "version = \"${PACKAGE_VERSION}\"" Cargo.toml
          cargo package --locked --allow-dirty

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          {
            echo "### Release candidate: \`${PACKAGE_VERSION}\`"
            echo "The package was built from \`${GITHUB_SHA}\` and is available as the \`${ARTIFACT_NAME}\` workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.candidate.outputs.ARTIFACT_NAME }}
          path: target/package/prima_bridge-${{ steps.candidate.outputs.PACKAGE_VERSION }}.crate
          if-no-files-found: error
          overwrite: true

      - name: Comment on PR with test instructions
        env:
          ARTIFACT_NAME: ${{ steps.candidate.outputs.ARTIFACT_NAME }}
          PACKAGE_VERSION: ${{ steps.candidate.outputs.PACKAGE_VERSION }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PR=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --paginate --jq '.[]' |
            jq -sr --arg repo "$GITHUB_REPOSITORY" \
              '[.[] | select(.state == "open" and .head.repo.full_name == $repo)] |
               if length == 1 then .[0].number else error("Expected exactly one open PR for the selected commit") end')

          MARKER="<!-- prima-bridge-rc-artifact -->"
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          ${MARKER}
          A test package for \`prima_bridge = "=${PACKAGE_VERSION}"\` was built from commit \`${GITHUB_SHA}\`.

          To download and extract it in a Rust project:

          \`\`\`bash
          gh run download ${RUN_ID} --repo ${GITHUB_REPOSITORY} --name ${ARTIFACT_NAME} --dir .prima-bridge-rc
          tar -xzf .prima-bridge-rc/prima_bridge-${PACKAGE_VERSION}.crate -C .prima-bridge-rc
          \`\`\`

          Set the dependency version in \`Cargo.toml\` (preserving any existing feature settings) and add a local patch:

          \`\`\`toml
          [dependencies]
          prima_bridge = "=${PACKAGE_VERSION}"

          [patch.crates-io]
          prima_bridge = { path = ".prima-bridge-rc/prima_bridge-${PACKAGE_VERSION}" }
          \`\`\`

          Run \`cargo check\` to test it. Do not commit the temporary patch or extracted files.
          The GitHub CLI must be authenticated with access to \`${GITHUB_REPOSITORY}\`.
          EOF

          COMMENT_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate |
            jq -sr --arg marker "$MARKER" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))][0].id // empty')

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --raw-field "body=$(cat "$BODY_FILE")"
          else
            gh pr comment "$PR" --body-file "$BODY_FILE"
          fi
